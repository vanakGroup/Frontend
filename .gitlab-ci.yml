stages:
  - build

variables:
  IMAGE_TAG: registry.hamgit.ir/$CI_PROJECT_PATH:$CI_COMMIT_REF_SLUG

build_frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.hamgit.ir
  script:
    - docker build -f docker/Dockerfile -t $IMAGE_TAG .
    - docker push $IMAGE_TAG