stages:
  - build-and-push
  - deploy

build_and_push_to_hamdocker:
  stage: build-and-push
  tags:
    - vps-runner
  #rules:
  #  - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    HAMDOCKER_REGISTRY: "registry.hamdocker.ir"
    HAMDOCKER_IMAGE: "registry.hamdocker.ir/hossein-rasipour/vanak-frontend"
  before_script:
    - echo "$HAMDOCKER_PASSWORD" | docker login $HAMDOCKER_REGISTRY -u "$HAMDOCKER_USER" --password-stdin
  script:
    - docker build -f docker/Dockerfile -t $HAMDOCKER_IMAGE:latest -t $HAMDOCKER_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $HAMDOCKER_IMAGE:latest
    - docker push $HAMDOCKER_IMAGE:$CI_COMMIT_SHORT_SHA

deploy_to_vps:
  stage: deploy
  tags:
    - vps-runner
  #rules:
    #- if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    HAMDOCKER_REGISTRY: "registry.hamdocker.ir"
    HAMDOCKER_IMAGE: "registry.hamdocker.ir/hossein-rasipour/vanak-frontend"
  script:
    - echo "$HAMDOCKER_PASSWORD" | docker login $HAMDOCKER_REGISTRY -u "$HAMDOCKER_USER" --password-stdin
    - docker pull $HAMDOCKER_IMAGE:latest
    
    - docker rm -f vanak-frontend-container || true
    - docker run -d --name vanak-frontend-container -p 80:80 --restart always $HAMDOCKER_IMAGE:latest
    - docker image prune -f