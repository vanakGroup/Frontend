stages:
  - build

variables:
  DOCKER_HOST: ""
  DOCKER_TLS_CERTDIR: ""

build_frontend:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  before_script:
    - sleep 5
    # استفاده از سوکت محلی برای دستور لاگین
    - echo '3EU8RIZgmewsImOkA1!' | docker -H unix:///var/run/docker.sock login -u hossein-rasipour --password-stdin registry.hamdocker.ir
  script:
    # اصلاح جایگاه پرچم -H بلافاصله بعد از دستور docker
    - docker -H unix:///var/run/docker.sock build -f docker/Dockerfile -t registry.hamdocker.ir/hossein-rasipour/vanak-frontend:$CI_COMMIT_REF_SLUG .
    - docker -H unix:///var/run/docker.sock push registry.hamdocker.ir/hossein-rasipour/vanak-frontend:$CI_COMMIT_REF_SLUG