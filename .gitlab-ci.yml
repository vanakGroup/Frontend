stages:
  - build-and-push

build_with_kaniko:
  stage: build-and-push
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  
  variables:
    HAMDOCKER_REGISTRY: "registry.hamdocker.ir"
    HAMDOCKER_IMAGE: "registry.hamdocker.ir/hossein-rasipour/vanak-frontend"

  script:
    - mkdir -p /kaniko/.docker
    
    - echo "{\"auths\":{\"$HAMDOCKER_REGISTRY\":{\"auth\":\"$(echo -n ${HAMDOCKER_USER}:${HAMDOCKER_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
    
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile"
      --destination "${HAMDOCKER_IMAGE}:latest"